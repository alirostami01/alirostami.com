name: Generate project pages

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install markdown
      - run: python3 scripts/build-project-page.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Persian-Subtitles/index.html Persian-Streams/index.html
          rm -f .github/workflows/generate-project-pages-once.yml
          git add -u .github/workflows/generate-project-pages-once.yml
          git commit -m 'Add Stremio install links to project pages' || exit 0
          git push
